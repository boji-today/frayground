openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Frayground MVP Design Contract
  version: 1.0.0
  description: 设计契约，尚未实现。planned-mvp 为下一轮范围；future 不部署。本机管理面不是外部 Agent 授权面。
servers:
- url: http://localhost:8080
  description: 计划中的本机服务
tags:
- name: Laboratory
  description: 仅本机操作者管理面
- name: ExternalAgent
  description: 未来协议，不部署
paths:
  /api/v1/rooms/current:
    get:
      operationId: getCurrentRoom
      summary: 获取唯一房间及一致快照
      tags:
      - Laboratory
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomView'
              examples:
                Room:
                  $ref: '#/components/examples/Room'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-implementation-status: planned-mvp
    post:
      operationId: ensureCurrentRoom
      summary: 获取或初始化唯一房间
      tags:
      - Laboratory
      parameters:
      - $ref: '#/components/parameters/LaboratoryClient'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomView'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
