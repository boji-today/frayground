        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: 首次创建；已存在为 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomView'
      x-implementation-status: planned-mvp
  /api/v1/rooms/{roomId}:
    get:
      operationId: getRoom
      summary: 获取房间
      tags:
      - Laboratory
      parameters:
      - $ref: '#/components/parameters/roomId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
