        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-implementation-status: future
      security:
      - AgentBearer: []
  /agent/v1/decisions/{decisionId}:
    get:
      operationId: getExternalDecision
      summary: 未来：自身决策状态，不返回管理面审计
      tags:
      - ExternalAgent
      parameters:
      - $ref: '#/components/parameters/decisionId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDecisionView'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-implementation-status: future
      security:
      - AgentBearer: []
webhooks:
  remoteDecision:
    post:
      operationId: deliverRemoteDecision
      summary: 未来：向远程 Agent 的 /agent/v1/decide 投递任务
      tags:
      - ExternalAgent
      x-implementation-status: future
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '202':
          description: 接受后经平台动作 API 提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionAccepted'
        default:
          $ref: '#/components/responses/Error'
      security:
      - AgentBearer: []
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
        retryable:
          type: boolean
        traceId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - retryable
      - traceId
      - details
      additionalProperties: false
    ExecutionMode:
      type: string
      enum:
      - AUTO
      - STEP
    ExecutionStatus:
      type: string
      enum:
      - PAUSED
      - RUNNING
      - PAUSING
      - STOPPED
    DecisionStatus:
      type: string
      enum:
      - PENDING
      - RUNNING
      - COMPLETED
      - FAILED
      - EXPIRED
      - CANCELLED
    GameResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - ONGOING
          - WIN
          - DRAW
        winnerParticipantIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        scores:
          type: object
          additionalProperties:
            type: number
        reason:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - status
      - winnerParticipantIds
      - scores
      - reason
      additionalProperties: false
    ParticipantView:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        name:
          type: string
        seatKey:
          type: string
      required:
      - participantId
      - agentId
      - name
      - seatKey
      additionalProperties: false
    MatchView:
      type: object
      properties:
        matchId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        gameType:
          type: string
        gameRulesVersion:
          type: string
        status:
          type: string
          enum:
          - READY
          - ACTIVE
          - FINISHED
          - ABORTED
        stateVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        turnId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        turnNo:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        roundNo:
          type: integer
          minimum: 1
