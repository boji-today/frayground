                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ActionSubmissionResult'
        '422':
          description: 领域拒绝为 REJECTED 回执；格式/ID 内容冲突为 Error。
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ActionSubmissionResult'
        '503':
