      summary: 未来：统一动作提交，MVP 使用内部 ActionSubmitter
      tags:
      - ExternalAgent
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSubmissionResult'
