spring:
  datasource:
    # The JDBC transaction manager is present by project convention; this profile
    # never opens a connection for the game transaction manager.
    url: jdbc:mysql://127.0.0.1:3306/frayground
    username: frayground
    hikari:
      initialization-fail-timeout: -1
frayground:
  storage:
    mode: memory
  laboratory:
    room-id: 00000000-0000-4000-8000-000000000001
    agent-a: 00000000-0000-4000-8000-000000000002
    agent-b: 00000000-0000-4000-8000-000000000003
    agents:
      a:
        runtime: MOCK
        prompt: Choose a legal move.
        provider: deepseek
        model-id: deepseek-flash
        thinking: false
        temperature: 0
        max-output-tokens: 1024
        decision-timeout-ms: 30000
        output-strategy: JSON_MODE
        allow-beta: false
      b:
        runtime: MOCK
        prompt: Choose a legal move.
        provider: deepseek
        model-id: deepseek-flash
        thinking: false
        temperature: 0
        max-output-tokens: 1024
        decision-timeout-ms: 30000
        output-strategy: JSON_MODE
        allow-beta: false
